; PlatformIO Project Configuration File

[platformio]
default_envs = gen1_nano
; Optional local overlay (uncomment for local-only overrides):
; extra_configs = platformio.local.ini

[env]
framework = arduino
upload_speed = 115200
monitor_speed = 115200
lib_deps =
    cameronbrooks11/CRUMBS @ ^0.17.0
    cameronbrooks11/bread-crumbs-contracts @ ^0.11.1
    cameronbrooks11/LMD18200 @ ^0.1.5
    cameronbrooks11/DCMotorServo @ ^1.2.1
    paulstoffregen/Encoder @ ^1.4.4
    cameronbrooks11/bread-slice-core @ ^0.2.0
build_flags =
    -DCRUMBS_MAX_HANDLERS=12
    ; override for flashed board address:
    ; -DI2C_ADR=21
    ; enable debug serial output:
    ; -DSLICE_DEBUG=1
    ; optional speed-loop override (default: nano=0, nano_every=1):
    ; -DDCMT_ENABLE_SPEED_LOOP=1
    ; boot with the command watchdog armed (ms); default: boots disarmed:
    ; -DDCMT_WATCHDOG_BOOT_MS=5000

[env:nano_base]
platform = platformio/atmelavr @ 5.3.0
board = nanoatmega328new

[env:nanoevery_base]
platform = platformio/atmelmegaavr @ 1.10.0
board = nano_every

[env:gen1_nano]
extends = env:nano_base
build_flags =
    ${env.build_flags}
    -DDCMT_HW_GEN=1

[env:gen2_nano]
extends = env:nano_base
build_flags =
    ${env.build_flags}
    -DDCMT_HW_GEN=2

; ----- Arduino Nano Every variants -----
[env:gen1_nanoevery]
extends = env:nanoevery_base
build_flags =
    ${env.build_flags}
    -DDCMT_HW_GEN=1

[env:gen2_nanoevery]
extends = env:nanoevery_base
build_flags =
    ${env.build_flags}
    -DDCMT_HW_GEN=2

; ----- No encoders: both headers empty, open loop only -----
; For boards whose motors have no encoders. GET_CAPS reports level 1, and the
; closed-loop modes are refused BREAD_REFUSE_NOT_BUILT (config.h).
[noenc]
build_flags =
    -DDCMT_PORT1_INPUT=DCMT_INPUT_NONE
    -DDCMT_PORT2_INPUT=DCMT_INPUT_NONE

[env:gen1_nano_noenc]
extends = env:gen1_nano
build_flags =
    ${env:gen1_nano.build_flags}
    ${noenc.build_flags}

[env:gen2_nano_noenc]
extends = env:gen2_nano
build_flags =
    ${env:gen2_nano.build_flags}
    ${noenc.build_flags}

[env:gen1_nanoevery_noenc]
extends = env:gen1_nanoevery
build_flags =
    ${env:gen1_nanoevery.build_flags}
    ${noenc.build_flags}

[env:gen2_nanoevery_noenc]
extends = env:gen2_nanoevery
build_flags =
    ${env:gen2_nanoevery.build_flags}
    ${noenc.build_flags}
