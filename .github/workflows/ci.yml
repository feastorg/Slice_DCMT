name: CI

on:
  push:
    branches: [main]
    paths:
      - "slice.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "slice.yaml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: feastorg/bread-infra/.github/workflows/validate-manifest.yml@v1.3.0
    with:
      schema_ref: schema-v2.0
